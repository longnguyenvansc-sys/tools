<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ công cụ O&amp;M Solar</title>
<style>
  :root {
    color-scheme: light;
    --bg:      #f8fafc;
    --surface: #ffffff;
    --border:  #e2e8f0;
    --text:    #0f172a;
    --text-dim:#64748b;
    --accent:  #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:      #0d0d0d;
      --surface: #1a1a19;
      --border:  #2c2c2a;
      --text:    #ffffff;
      --text-dim:#94a3b8;
      --accent:  #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:      #0d0d0d;
    --surface: #1a1a19;
    --border:  #2c2c2a;
    --text:    #ffffff;
    --text-dim:#94a3b8;
    --accent:  #3987e5;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.75rem clamp(0.75rem, 4vw, 1.5rem) 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 0.6rem 0;
    font-size: clamp(1.05rem, 3.2vw, 1.3rem);
  }
  nav.tabs {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
  }
  nav.tabs button {
    flex: 0 0 auto;
    appearance: none;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    color: var(--text-dim);
    padding: 0.55rem 0.9rem;
    border-radius: 0.5rem 0.5rem 0 0;
    font-size: 0.9rem;
    cursor: pointer;
  }
  nav.tabs button.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    border-color: var(--border);
  }
  main {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  main iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--surface);
  }
  main iframe.active {
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>Bộ công cụ O&amp;M Solar</h1>
  <nav class="tabs">
    <button type="button" class="active" data-target="frame-cosphi">Cosφ &amp; Công suất phản kháng</button>
    <button type="button" data-target="frame-doNghieng">Chuyển đổi độ nghiêng mái</button>
  </nav>
</header>

<main>
  <iframe id="frame-cosphi" class="active" src="cosphi.html" title="Công cụ tính Cosφ &amp; Công suất phản kháng"></iframe>
  <iframe id="frame-doNghieng" src="Convert_degrees_percentage..html" title="Chuyển đổi Độ nghiêng mái"></iframe>
</main>

<script>
  const buttons = document.querySelectorAll('nav.tabs button');
  const frames = document.querySelectorAll('main iframe');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      frames.forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>

</body>
</html>
